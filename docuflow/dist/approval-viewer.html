<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Persetujuan PDF</title><link rel="stylesheet" href="pdf-viewer.css"><link rel="stylesheet" href="approval-viewer.css"><script src="vendor/pdf-3.11.174.min.js" defer></script><script src="signature-geometry.js" defer></script><script src="approval-viewer.js" defer></script></head>
<body><header class="approval-header"><div><strong id="approval-title">Persetujuan dokumen</strong><p id="approval-code"></p></div><button id="approval-close" type="button">Tutup</button></header><main id="approval-pages" aria-label="Halaman PDF"><p id="approval-message" role="status">Menyiapkan dokumen…</p></main><div class="approval-float"><div id="signature-size-controls" role="group" aria-label="Ukuran tanda tangan" hidden><label for="signature-size">Ukuran TTD</label><button type="button" id="signature-smaller" aria-label="Perkecil tanda tangan">&minus;</button><input id="signature-size" type="range" min="10" max="300" step="1" value="100" aria-label="Skala tanda tangan"><button type="button" id="signature-larger" aria-label="Perbesar tanda tangan">+</button><input id="signature-percent" type="number" min="10" max="300" step="1" value="100" aria-label="Ukuran tanda tangan (%)"><span>%</span></div><button id="signature-select" type="button" hidden>✎ &nbsp; Tanda tangani</button><button id="signature-confirm" type="button" hidden>Setujui dan simpan</button><span id="approval-hint" role="status"></span></div><dialog id="signature-dialog"><h2>Pilih tanda tangan</h2><p>Gunakan tanda tangan dari profil Anda.</p><img id="saved-signature" alt="Tanda tangan Anda"><div><button id="signature-cancel" type="button">Batal</button><button id="signature-use" type="button">Gunakan tanda tangan</button></div></dialog></body></html>
